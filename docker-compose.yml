version: "3.8"
services:
  mysql:
    image: mysql:8
    ports:
      - "3310:3306"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
